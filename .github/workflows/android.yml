name: Android build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать проект
        run: |
          if [ ! -f settings.gradle.kts ] && [ -f AliCraft-Launcher-source.zip ]; then
            unzip -oq AliCraft-Launcher-source.zip -d .
          fi
          ls -la
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Сборка
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AliCraft-Launcher-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
